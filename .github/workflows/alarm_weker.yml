name: Weker Bot Saham 🚀

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Tarik Kode
      uses: actions/checkout@v3
      
    - name: Siapin Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install pip
      run: pip install yfinance pandas aiohttp holidays
      
    - name: JALANKAN BOT SAHAM
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python bot_saham.py
