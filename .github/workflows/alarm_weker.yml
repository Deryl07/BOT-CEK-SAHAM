name: Weker Bot Saham 🚀

on:
  schedule:
    # 09:15 UTC = 16:15 WIB (Senin sampai Jumat)
    - cron: '0 * * * *'
  workflow_dispatch: # Biar bisa dipencet manual kalau lagi pengen

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode
        uses: actions/checkout@v3
        
      - name: Siapin Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Alat Tempur
        run: pip install -r requirements.txt
        
- name: JALANKAN BOT
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python bot_saham.py
