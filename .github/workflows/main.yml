name: Bot Saham

on:
  schedule:
    - cron: '0 2-9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: operasi-bot
  cancel-in-progress: true

jobs:
  eksekusi-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil Repositori
      uses: actions/checkout@v3

    - name: Menyiapkan Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Menginstal Pip
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas holidays aiohttp

    - name: Menjalankan Skrip Sistem
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python bot_saham.py
